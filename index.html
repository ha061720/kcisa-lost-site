<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다시찾음 | 올림픽공원 유실물 찾기</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17223b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#142b55;color:white;padding:26px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:26px}header p{color:#d1e0fb;margin:8px 0 0}.wrap{max-width:1100px;margin:auto;padding:26px 18px}.hero{background:linear-gradient(125deg,#e4edff,#fefeff);padding:28px;border-radius:22px;margin-bottom:20px}.hero h2{font-size:28px;margin:0 0 10px}.hero p{color:#53627a;line-height:1.7;margin:0}.panel{background:white;border:1px solid #e1e7f1;border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 6px 24px #1c315408}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,button{font:inherit;border-radius:10px;padding:12px;width:100%}input,select{border:1px solid #d8dfeb;background:white}button{border:0;background:#285fd6;color:white;cursor:pointer;font-weight:700}.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px}.actions button{width:auto}.muted{color:#62718b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{background:white;border:1px solid #e2e8f2;border-radius:16px;padding:19px;box-shadow:0 4px 14px #1c315408}.item h3{margin:10px 0;font-size:19px}.tag{font-size:12px;color:#2459bf;background:#eaf0ff;padding:5px 9px;border-radius:20px;display:inline-block}.item p{font-size:14px;color:#4e5b70;line-height:1.5;margin:8px 0}.item strong{color:#233653}.item button{margin-top:10px;background:#eef3ff;color:#2459bf}.notice{border-left:4px solid #e7a13e;background:#fff8eb;padding:13px 16px;border-radius:8px;color:#77531c;margin:18px 0;font-size:14px;line-height:1.6}dialog{border:0;border-radius:18px;max-width:550px;width:calc(100% - 24px);padding:25px;box-shadow:0 25px 90px #0005}dialog::backdrop{background:#15213999}dialog p{line-height:1.7;overflow-wrap:anywhere}.close{background:#e9eef8;color:#243b60}.status{font-size:13px;color:#61708a}footer{text-align:center;padding:30px;color:#7a879b;font-size:12px}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.controls,.grid{grid-template-columns:1fr}.hero h2{font-size:23px}.actions{flex-wrap:wrap}}
</style></head><body><header><h1>🔎 다시찾음</h1><p>KCISA 공공데이터 기반 · 올림픽공원 유실물 검색</p></header><main class="wrap"><section class="hero"><h2>잃어버린 물건, 공지에서 찾아보세요.</h2><p>올림픽공원 습득물 공지에 포함된 물품을 검색하고 담당 안내센터에 문의할 수 있습니다.</p></section><div class="notice">⚠️ 이 서비스는 공개된 과거 공지 데이터 검색용입니다. 실제 보관 여부와 수령 가능 여부는 안내센터에 반드시 확인하세요. '연락완료'는 반환 완료를 의미하지 않습니다.</div><section class="panel"><div class="controls"><div><label for="q">물품명 · 특징 · 장소</label><input id="q" placeholder="예: 카드지갑, 벨로드롬"></div><div><label for="place">습득 장소</label><select id="place"><option value="">전체 장소</option></select></div><div><label for="start">시작 날짜</label><input type="date" id="start"></div><div><label for="end">종료 날짜</label><input type="date" id="end"></div></div><div class="actions"><span class="status" id="status">데이터 읽는 중...</span><div style="display:flex;gap:8px"><button id="reset" style="background:#edf2fb;color:#2851a3">초기화</button><button id="csv">CSV 저장</button><button id="refresh" hidden>API 새로고침</button></div></div></section><div class="grid" id="results"></div><div style="text-align:center;margin:24px"><button id="more" style="max-width:250px;display:none">더 보기</button></div></main><dialog id="detail"><div id="detailBody"></div><button class="close" onclick="document.getElementById('detail').close()">닫기</button></dialog><footer>출처: 한국문화정보원 KCISA · 올림픽공원 유실물 정보(공지) · 비공식 시범 서비스</footer><script>
let all=[],filtered=[],visible=24;const $=id=>document.getElementById(id);const safe=s=>String(s??'');const esc=s=>safe(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(){const q=$('q').value.trim().toLowerCase(),place=$('place').value,start=$('start').value,end=$('end').value;filtered=all.filter(x=>(!q||[x.name,x.place,x.feature,x.center,x.note].join(' ').toLowerCase().includes(q))&&(!place||x.place===place)&&(!start||x.date>=start)&&(!end||x.date<=end));visible=24;render()}
function render(){const shown=filtered.slice(0,visible);$('status').textContent=`검색 결과 ${filtered.length.toLocaleString()}건 / 전체 ${all.length.toLocaleString()}건`;$('results').innerHTML=shown.length?shown.map(x=>`<article class="item"><span class="tag">${esc(x.date)}</span><h3>${esc(x.name)}</h3><p>📍 <strong>습득 장소</strong> ${esc(x.place)}</p><p>🏢 <strong>담당</strong> ${esc(x.center||'공지 확인 필요')}</p><p>📝 ${esc(x.feature||'상세 특징 미기재')}</p><button data-id="${esc(x.id)}">상세정보 · 문의처</button></article>`).join(''):'<div class="panel">검색 조건에 맞는 물품이 없습니다.</div>';$('more').style.display=visible<filtered.length?'inline-block':'none'}
function detail(id){const x=all.find(v=>v.id===id);if(!x)return;$('detailBody').innerHTML=`<h2>${esc(x.name)}</h2><p><strong>습득 날짜:</strong> ${esc(x.date)}</p><p><strong>습득 장소:</strong> ${esc(x.place)}</p><p><strong>수량:</strong> ${esc(x.quantity)}</p><p><strong>특징:</strong> ${esc(x.feature||'기재 없음')}</p><p><strong>비고:</strong> ${esc(x.note||'기재 없음')}</p><p><strong>담당 안내센터:</strong> ${esc(x.center||'미확인')}</p><p><strong>문의처:</strong> ${esc(x.phone||'원본 공지 확인')}</p><p><strong>원본 공지 제목:</strong> ${esc(x.sourceTitle)}</p><p class="muted">API 등록일: ${esc(x.registered)} · 현재 보관 여부 미확인</p>`;$('detail').showModal()}
$('results').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)});['q','place','start','end'].forEach(id=>$(id).addEventListener('input',update));$('more').onclick=()=>{visible+=24;render()};$('reset').onclick=()=>{$('q').value='';$('place').value='';$('start').value='';$('end').value='';update()};$('csv').onclick=()=>{const keys=['date','name','quantity','place','feature','note','center','phone','sourceTitle'];const rows=[keys,...filtered.map(x=>keys.map(k=>x[k]||''))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+safe(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='KCISA_유실물_검색결과.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
async function init(){let data;try{const r=await fetch('/api/items');if(!r.ok)throw Error('offline');data=await r.json();$('refresh').hidden=false}catch(e){const r=await fetch('data.json');if(!r.ok)throw Error('데이터 파일을 찾을 수 없습니다. 서버를 실행하세요.');data=await r.json()}all=data.records||[];const places=[...new Set(all.map(x=>x.place).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));$('place').innerHTML='<option value="">전체 장소</option>'+places.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');update()}
$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;b.textContent='갱신 중...';try{const r=await fetch('/api/refresh',{method:'POST'});const data=await r.json();if(!r.ok)throw Error(data.error||'갱신 실패');all=data.records;update();alert('KCISA API 데이터를 갱신했습니다.')}catch(e){alert('API 갱신 실패: '+e.message+'\n기존 데이터는 유지됩니다.')}finally{b.disabled=false;b.textContent='API 새로고침'}};init().catch(e=>$('status').textContent=e.message);
</script></body></html>
